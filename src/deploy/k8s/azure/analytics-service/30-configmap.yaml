apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-service-config
  namespace: redirect-application
data:
  # HTTP
  SERVER_PORT: "8000"
  ADMIN_PORT: "9090"
  SERVER_WRITE_TIMEOUT: "30s"
  SERVER_IDLE_TIMEOUT: "120s"

  # database
  DB_HOST: "postgres-analytics"
  DB_PORT: "5432"
  DB_NAME: "analytics"
  DB_SSLMODE: "disable"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "10"
  DB_MAX_CONN_LIFETIME: "30m"
  DB_MAX_CONN_IDLE_TIME: "5m"
  DB_CONNECT_TIMEOUT: "5s"

  # RabbitMQ
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  RABBITMQ_EXCHANGE: "clicks"
  RABBITMQ_QUEUE: "clicks.analytics"
  RABBITMQ_ROUTING_KEY: "click.recorded"
  CONSUMER_PREFETCH: "1000"
  BATCH_SIZE: "500"
  FLUSH_INTERVAL: "1s"

  # logging
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"