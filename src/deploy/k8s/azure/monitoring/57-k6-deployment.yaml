apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6
  namespace: redirect-application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k6
  template:
    metadata:
      labels:
        app: k6
    spec:
      nodeSelector:
        workload: loadgen
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          # Idle container. Scripts are copied in with kubectl cp and run
          # with kubectl exec, so the pod stays warm between runs.
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "3000m"
              memory: "8Gi"
            limits:
              memory: "12Gi"