apiVersion: v1
kind: ConfigMap
metadata:
  name: urlshortener-service-config
  namespace: redirect-application
data:
  # HTTP
  SERVER_PORT: "8000"
  ADMIN_PORT: "9090"
  SERVER_WRITE_TIMEOUT: "30s"
  SERVER_IDLE_TIMEOUT: "120s"

  # database
  DB_HOST: "postgres-urlshortener"
  DB_PORT: "5432"
  DB_NAME: "urlshortener"
  DB_SSLMODE: "disable"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "10"
  DB_MAX_CONN_LIFETIME: "30m"
  DB_MAX_CONN_IDLE_TIME: "5m"
  DB_CONNECT_TIMEOUT: "5s"

  # application
  SHORT_BASE_URL: "https://sh.example.com"

  # logging
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"

  # shutdown
  SHUTDOWN_READINESS_DRAIN: "5s"
  SHUTDOWN_TIMEOUT: "15s"