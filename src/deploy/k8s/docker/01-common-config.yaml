apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: redirect-application
data:
  # Only values every service reads AND that should change for all at once.
  DB_PORT: "5432"
  DB_SSLMODE: "disable"
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"
  SHUTDOWN_READINESS_DRAIN: "5s"
  SHUTDOWN_TIMEOUT: "15s"