apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-urlshortener
  namespace: redirect-application
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-urlshortener
  namespace: redirect-application
spec:
  replicas: 1
  # A PVC with ReadWriteOnce cannot be mounted by two pods, so a rolling update
  # would deadlock: the new pod waits for a volume the old pod still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-urlshortener
  template:
    metadata:
      labels:
        app: postgres-urlshortener
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: urlshortener
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: urlshortener-db-credentials, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: urlshortener-db-credentials, key: DB_PASS }
            # initdb refuses a non-empty directory, and many volumes arrive with
            # a lost+found. A subdirectory sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "urlshortener"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgdata-urlshortener
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-urlshortener
  namespace: redirect-application
spec:
  selector:
    app: postgres-urlshortener
  ports:
    - port: 5432
      targetPort: postgres