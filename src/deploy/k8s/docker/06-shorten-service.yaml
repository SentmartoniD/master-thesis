apiVersion: v1
kind: ConfigMap
metadata:
  name: shorten-config
  namespace: redirect-application
data:
  DB_HOST: "postgres-urlshortener"
  DB_NAME: "urlshortener"
  # Pinned, not left to pgxpool's default of max(4, NumCPU) — otherwise the pool
  # size silently tracks the node SKU and confounds the RQ2 comparison.
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "10"
  SHORT_BASE_URL: "http://localhost:8000"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shorten-migrate
  namespace: redirect-application
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: shorten-service:latest
          imagePullPolicy: IfNotPresent
          # In Kubernetes, command: overrides the image ENTRYPOINT.
          # (In Compose it is command: that maps to CMD — different rule.)
          command: ["/app/migrate"]
          envFrom:
            - configMapRef: { name: common-config }
            - configMapRef: { name: shorten-config }
            - secretRef:    { name: urlshortener-db-credentials }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorten-service
  namespace: redirect-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shorten-service
  template:
    metadata:
      labels:
        app: shorten-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: shorten-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef: { name: common-config }
            - configMapRef: { name: shorten-config }
            - secretRef:    { name: urlshortener-db-credentials }
          startupProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            # Never touches the database: a shared dependency going slow would
            # otherwise restart every pod in the fleet at once.
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            # CPU requested but not limited: a limit is what you would end up
            # measuring instead of the application.
            requests: { cpu: "200m", memory: "64Mi" }
            limits:   { memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: shorten-service
  namespace: redirect-application
spec:
  type: NodePort
  selector:
    app: shorten-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30081
    - name: admin
      port: 9090
      targetPort: admin