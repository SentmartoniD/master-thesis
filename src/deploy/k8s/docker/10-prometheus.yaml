apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: redirect-application
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      # job_name becomes the `job` label your script groups by, so these
      # names must match the ones your Compose runs produced.
      - job_name: shorten-service
        static_configs:
          - targets: ['shorten-service:9090']
      - job_name: redirect-service
        static_configs:
          - targets: ['redirect-service:9090']
      - job_name: analytics-service
        static_configs:
          - targets: ['analytics-service:9090']
      - job_name: rabbitmq
        static_configs:
          - targets: ['rabbitmq:15692']
      - job_name: postgres
        static_configs:
          - targets: ['postgres-exporter:9187']
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: redirect-application
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: redirect-application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        # The image runs as nobody(65534); the PVC arrives root-owned.
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { memory: "1Gi" }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: redirect-application
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: redirect-application
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: web
      nodePort: 30900